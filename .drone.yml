kind: pipeline
type: docker
name: web-portfolio-v2

clone:
  disable: true

timeout: 30m

steps:
  - name: Deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: vps_ip
      username:
        from_secret: ssh_user
      port:
        from_secret: ssh_port
      key:
        from_secret: ssh_private_key
      script:
        - cd ~/projects/web-portfolio-v2
        - git pull origin master
        # Build while the old container keeps serving; up -d then only swaps the container (~1-2s gap).
        - docker-compose build
        - docker-compose up -d
        - docker system prune -f

trigger:
  event:
    - push
  branch:
    - master
